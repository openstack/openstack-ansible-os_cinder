## APT Cache options
cache_timeout: 600

# service names
tgt_service_name: tgt

# Common apt packages
_cinder_package_names_condition: >-
  {{
    (
      (ansible_facts['distribution'] | lower == 'debian' and ansible_facts['distribution_major_version'] is version('14', '>=')) or
        (ansible_facts['distribution'] | lower == 'ubuntu' and ansible_facts['distribution_version'] is version('26.04', '>='))
    )
  }}

cinder_distro_packages:
  - libkmod2
  - "{{ _cinder_package_names_condition | ternary('libxml2-16', 'libxml2') }}"
  - zlib1g

cinder_service_distro_packages:
  - python3-cinder
  - python3-systemd

cinder_devel_distro_packages:
  - git
  - libffi-dev
  - libkmod-dev
  - libpq-dev
  - libssl-dev
  - libxslt1-dev
  - libsystemd-dev

cinder_api_distro_packages: []

cinder_volume_service_distro_packages: []

cinder_volume_distro_packages_tools:
  - qemu-utils

cinder_volume_distro_packages:
  - open-iscsi
  - nfs-common
  - rpcbind

cinder_lvm_volume_distro_packages:
  - dmeventd
  - lvm2
  - parted
  - tgt
  - thin-provisioning-tools

cinder_backup_service_distro_packages: []

cinder_backup_distro_packages:
  - open-iscsi
  - nfs-common
  - rpcbind

_cinder_extra_gpg_keys: []
_cinder_extra_repos: []
